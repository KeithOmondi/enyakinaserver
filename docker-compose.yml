# Local Postgres for the POS API (separate from any other project's database).
#   docker compose up -d        start
#   docker compose down         stop (data kept)
#   docker compose down -v      stop and DELETE all data
name: joy   # keeps the existing container and data volume
services:
  db:
    image: postgres:16
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD:?set POS_DB_PASSWORD in server/.env}
      POSTGRES_DB: pos
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host: 5432 is used by another Postgres
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pos_pgdata:
