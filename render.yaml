# Render blueprint for the API. Secrets are marked `sync: false`: Render asks for them in the
# dashboard and they never live in this file or in git.
services:
  - type: web
    name: enyakin-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Migrations are idempotent and locked, so running them on every start is safe.
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # Render puts one proxy in front of the app
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Africa/Nairobi
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: DATABASE_URL # Neon POOLED string (host contains -pooler): used by the running API
        sync: false
      - key: MIGRATE_DATABASE_URL # Neon DIRECT string (no -pooler): used only by migrations
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Photos (optional, all five or none)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # M-Pesa prompts (leave MPESA_MODE unset to keep them off)
      - key: MPESA_MODE
        sync: false
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      # One Till per business: the business code (upper case, dashes as underscores) is the prefix.
      - key: MPESA_GO_FISH_SHORTCODE
        sync: false
      - key: MPESA_GO_FISH_PARTY_B
        sync: false
      - key: MPESA_GO_FISH_PASSKEY
        sync: false
      - key: MPESA_GO_FISH_TRANSACTION_TYPE
        sync: false
      - key: MPESA_ENYAKIN_SHORTCODE
        sync: false
      - key: MPESA_ENYAKIN_PARTY_B
        sync: false
      - key: MPESA_ENYAKIN_PASSKEY
        sync: false
      - key: MPESA_ENYAKIN_TRANSACTION_TYPE
        sync: false
